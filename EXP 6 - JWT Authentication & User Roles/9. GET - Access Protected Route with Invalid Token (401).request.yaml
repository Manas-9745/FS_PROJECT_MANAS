$kind: http-request
url: "{{base_url}}/user/dashboard"
method: GET
headers:
  Authorization: "Bearer invalid_tampered_or_expired_jwt_token"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401 Unauthorized for invalid token", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Invalid or expired token error returned", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.message).to.eql("Invalid or expired token");
      });
    language: text/javascript
order: 9000
