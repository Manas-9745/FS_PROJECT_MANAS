$kind: http-request
url: "{{base_url}}/user/dashboard"
method: GET
headers:
  Authorization: "Bearer {{user_jwt_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Welcome to the protected dashboard", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.message).to.eql("Welcome to the protected dashboard");
          pm.expect(jsonData.user.role).to.eql("user");
      });
    language: text/javascript
order: 4000
