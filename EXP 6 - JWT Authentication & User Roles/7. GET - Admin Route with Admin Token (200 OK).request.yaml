$kind: http-request
url: "{{base_url}}/user/admin"
method: GET
headers:
  Authorization: "Bearer {{admin_jwt_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK for Admin role", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Welcome Admin message received", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.message).to.eql("Welcome Admin! You can access this page.");
      });
    language: text/javascript
order: 7000
