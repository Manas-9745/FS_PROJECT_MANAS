$kind: http-request
url: "{{base_url}}/{{item_id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "Found",
      "description": "White AirPods Pro - Claimed by owner. Resolved.",
      "location": "Admin Office"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Status updated to Found", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status).to.eql("Found");
      });
      pm.test("Description updated", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.description).to.include("Claimed");
      });
    language: text/javascript
order: 4000
