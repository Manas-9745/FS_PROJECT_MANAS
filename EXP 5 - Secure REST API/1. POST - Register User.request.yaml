$kind: http-request
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "student",
      "email": "student@gmail.com",
      "password": "student123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created or 400 User exists", function () {
          pm.expect([201, 400]).to.include(pm.response.code);
      });
      if (pm.response.code === 201) {
          pm.test("User registered successfully", function () {
              var jsonData = pm.response.json();
              pm.expect(jsonData.message).to.eql("User registered successfully");
              pm.expect(jsonData.userId).to.exist;
              pm.collectionVariables.set("user_id", jsonData.userId);
          });
      }
    language: text/javascript
order: 1000
